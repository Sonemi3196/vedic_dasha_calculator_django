{% extends "dasha_calculator/base.html" %}

{% block title %}新規登録 - ヴェーダ数秘術{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-gradient-to-br from-purple-50 to-blue-50 rounded-lg p-6">
        <h2 class="text-2xl font-bold text-center mb-6">新規登録</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">ユーザー名</label>
                <input type="text" id="username" required
                    class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">パスワード</label>
                <input type="password" id="password" required
                    class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-500">
                <p class="text-xs text-gray-500 mt-1">4文字以上で設定してください</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">パスワード（確認）</label>
                <input type="password" id="password2" required
                    class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-500">
            </div>
            
            <button onclick="doRegister()"
                class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-2.5 rounded-lg hover:from-purple-700 hover:to-blue-700 transition">
                登録する
            </button>
        </div>
       
        
        <div class="mt-4 text-center">
            <a href="{% url 'dasha_calculator:login' %}" class="text-purple-600 hover:text-purple-700">
                ログインはこちら
            </a>
        </div>
    </div>
</div>

<script>
async function doRegister() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (!username || !password) {
        alert('ユーザー名とパスワードを入力してください');
        return;
    }

    if (password !== password2) {
        alert('パスワードが一致しません');
        return;
    }

    const response = await fetch('/register/api/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.success) {
        window.location.href = '/';
    } else {
        alert(data.error);
    }
}
</script>
{% endblock %}
