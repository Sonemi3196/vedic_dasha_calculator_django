{% extends "dasha_calculator/base.html" %}

{% block title %}ログイン - ヴェーダ数秘術{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-gradient-to-br from-purple-50 to-blue-50 rounded-lg p-6">
        <h2 class="text-2xl font-bold text-center mb-6">ログイン</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">ユーザー名</label>
                <input type="text" id="username"
                    class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">パスワード</label>
                <input type="password" id="password"
                    class="w-full px-3 py-2 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-500">
            </div>
            
            <div id="loginError" class="hidden text-red-600 text-sm text-center"></div>
            
            <button onclick="doLogin()"
                class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-2.5 rounded-lg hover:from-purple-700 hover:to-blue-700 transition">
                ログイン
            </button>
        </div>
        
        <div class="mt-4 text-center">
            <a href="{% url 'dasha_calculator:register' %}" class="text-purple-600 hover:text-purple-700">
                新規登録はこちら
            </a>
        </div>
    </div>
</div>

<script>
// Enterキーでもログインできるように
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });
    document.getElementById('username').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });
});

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    
    if (!username || !password) {
        errorDiv.textContent = 'ユーザー名とパスワードを入力してください';
        errorDiv.classList.remove('hidden');
        return;
    }
    
    try {
        const response = await fetch('/login/api/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
            window.location.href = '/';
        } else {
            errorDiv.textContent = data.error || 'ログインに失敗しました';
            errorDiv.classList.remove('hidden');
        }
    } catch(e) {
        errorDiv.textContent = 'エラーが発生しました。再試行してください。';
        errorDiv.classList.remove('hidden');
    }
}
</script>
{% endblock %}
